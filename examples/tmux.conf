# Minimal config for trying tmux-zj without touching your own setup.
#
#   tmux -L zjdemo -f examples/tmux.conf
#
# `tmux-zj init` inherits $TMUX from the server that runs this file, so it lands
# on the same socket.

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 20000

run-shell "tmux-zj init"
